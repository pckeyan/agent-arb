name: close pull requests
on:
  pull_request_target: {types: [opened]}
jobs:
  close:
    # Only pull requests from forks are closed. Branches of this repository are the
    # maintainer's own workflow: every change goes through a PR that a person merges.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {pull-requests: write}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: context.payload.pull_request.number,
              body: "Thank you for the interest. Agent ARB is shared for use and discussion and does not accept pull requests. Bug reports and questions are welcome in Discussions."});
            await github.rest.pulls.update({...context.repo, pull_number: context.payload.pull_request.number, state: "closed"});
