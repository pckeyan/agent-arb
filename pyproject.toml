[project]
name = "agent-arb"
version = "0.1.0"
description = "Agent ARB: an architecture review board you can run on your laptop. Reviews design documents decision by decision against your standards and industry practice, with a local model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Karthik" }]
keywords = ["architecture", "review", "design-review", "adr", "llm", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.15",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pypdf>=5.0",
]

[project.urls]
Homepage = "https://github.com/pckeyan/agent-arb"
Changelog = "https://github.com/pckeyan/agent-arb/blob/main/CHANGELOG.md"

[project.scripts]
agent-arb = "agent_arb.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_arb"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "agent_arb/packs"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
