name: industry-recovery
layer: base
version: 0.1.0
description: Data durability, backup and disaster recovery.
rules:
  - id: IND-REC-001
    title: State an RPO and an RTO for every stateful component
    severity: high
    tags: [recovery, data, durability]
    requirement: Each component that holds state names a recovery point objective and a recovery time objective, and the backup and restore design is shown to meet both.
    evidence_hints: [RPO, RTO, recovery point, recovery time, restore]
    expects: [RPO value, RTO value]
    source: {kind: public-domain, name: "NIST SP 800-34 Rev. 1", locator: "Section 3.2, Business Impact Analysis", url: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final, licence: public domain (US government work)}
  - id: IND-REC-002
    title: Test restores, not just backups
    severity: high
    tags: [recovery, backup, testing]
    requirement: The design says how often a restore is exercised end to end, who performs it, and how the result is verified against the stated objectives.
    evidence_hints: [restore test, exercise, verify, drill]
    source: {kind: public-domain, name: "NIST SP 800-34 Rev. 1", locator: "Section 3.5, Plan Testing, Training and Exercises", url: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final, licence: public domain (US government work)}
  - id: IND-REC-003
    title: Keep backups isolated from the thing they protect
    severity: high
    tags: [backup, recovery, security]
    requirement: Backups are stored in a separate account, region or system with separate credentials, so that a failure or compromise of the primary cannot destroy them, and they are encrypted.
    evidence_hints: [backup, separate account, immutable, cross-region, encrypted]
    source: {kind: public-domain, name: "NIST SP 800-53 Rev. 5", locator: "CP-9 System Backup, CP-6 Alternate Storage Site", url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final, licence: public domain (US government work)}
  - id: IND-REC-004
    title: Name the replication mode and its consistency consequence
    severity: medium
    tags: [replication, data, consistency, durability]
    requirement: Where data is replicated, the design says whether replication is synchronous or asynchronous, the expected lag, and what a reader can observe during lag or failover.
    evidence_hints: [replication, synchronous, asynchronous, lag, failover]
    source: {kind: author-principle, name: Martin Kleppmann, locator: "Designing Data-Intensive Applications, Chapter 5, Replication", text_reused: none}
  - id: IND-REC-005
    title: Define retention and deletion for each data store
    severity: medium
    tags: [data, recovery]
    requirement: Each data store has a retention period with a reason, and a mechanism that actually deletes data when it expires, including from backups and replicas.
    evidence_hints: [retention, delete, expire, purge]
    source: {kind: public-domain, name: "NIST SP 800-53 Rev. 5", locator: "SI-12 Information Management and Retention", url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final, licence: public domain (US government work)}
