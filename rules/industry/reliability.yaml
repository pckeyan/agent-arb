name: industry-reliability
layer: base
version: 0.1.0
description: Availability and failure design. Adapted in Agent ARB's own words from publicly licensed sources named on each rule.
rules:
  - id: IND-REL-001
    title: State an availability objective with a measurement window
    severity: high
    tags: [reliability, availability, slo]
    requirement: The design names an availability target for the service, expressed as a percentage over a stated window, and says how availability is measured.
    evidence_hints: [availability, "99.9", uptime, SLO, window]
    expects: [percentage, window]
    source: {kind: cc-by, name: Google Cloud Architecture Framework, locator: Reliability pillar, define reliability goals, url: https://docs.cloud.google.com/architecture/framework/reliability, licence: CC BY 4.0, text_reused: adapted}
  - id: IND-REL-002
    title: Name every single point of failure and its accepted risk
    severity: high
    tags: [spof, availability, reliability]
    requirement: Each component that runs as a single instance, in a single zone, or behind a single network path is listed, with either a redundancy plan or an explicit statement that the risk is accepted and why.
    evidence_hints: [single point, redundancy, replica, zone, standby]
    source: {kind: cc-by, name: Azure Well-Architected Framework, locator: Reliability, design for redundancy, url: https://learn.microsoft.com/azure/well-architected/reliability/redundancy, licence: CC BY 4.0, text_reused: adapted}
  - id: IND-REL-003
    title: Spread critical components across failure domains
    severity: high
    tags: [availability, multi-region, reliability]
    requirement: Components that must stay up are deployed across more than one failure domain such as zones or regions, and the design states what happens when one domain is lost.
    evidence_hints: [zone, region, failure domain, multi-AZ]
    applies_when: {min_tier: 2}
    source: {kind: cc-by, name: Google Cloud Architecture Framework, locator: Reliability, build redundancy across failure domains, url: https://docs.cloud.google.com/architecture/framework/reliability, licence: CC BY 4.0, text_reused: adapted}
  - id: IND-REL-004
    title: Define health checks that reflect real readiness
    severity: medium
    tags: [availability, reliability, deployment]
    requirement: Each service exposes a liveness and a readiness signal, readiness reflects the ability to serve rather than process existence, and the design says what the platform does when either fails.
    evidence_hints: [health check, readiness, liveness, probe]
    source: {kind: cc-by, name: Kubernetes documentation, locator: Configure liveness, readiness and startup probes, url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/, licence: CC BY 4.0, text_reused: adapted}
  - id: IND-REL-005
    title: Make deployments reversible
    severity: medium
    tags: [deployment, delivery, reliability]
    requirement: The rollout strategy is named, for example canary or blue-green, a rollback path exists that does not require a forward fix, and schema or data changes are compatible with the previous version during rollout.
    evidence_hints: [rollback, canary, blue-green, backward compatible, migration]
    source: {kind: cc-by, name: Google Cloud Architecture Framework, locator: Reliability, deploy safely, url: https://docs.cloud.google.com/architecture/framework/reliability, licence: CC BY 4.0, text_reused: adapted}
  - id: IND-REL-006
    title: Separate configuration from code and from secrets
    severity: low
    scope: design
    tags: [deployment, delivery]
    requirement: Environment-specific configuration is supplied at deploy time rather than built into the artifact, and secrets are supplied through a secret store rather than configuration files.
    evidence_hints: [config, environment variable, secret store, artifact]
    source: {kind: mit, name: The Twelve-Factor App, locator: Factor III, Config, url: https://12factor.net/config, licence: MIT, text_reused: none}
