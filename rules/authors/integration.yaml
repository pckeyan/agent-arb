name: authors-integration
layer: base
version: 0.1.0
description: Messaging and integration principles. Pattern names are used as names; no text reused.
rules:
  - id: AUT-INT-001
    title: Message consumers are idempotent
    severity: high
    tags: [messaging, idempotency, integration]
    requirement: Every consumer tolerates receiving the same message more than once without a wrong side effect, and the design names how duplicates are detected, for example a message id store or a natural idempotency key.
    evidence_hints: [idempotent, duplicate, message id, dedupe]
    applies_when: {tags_any: [messaging, integration, idempotency]}
    source: {kind: author-principle, name: Gregor Hohpe and Bobby Woolf, locator: "Enterprise Integration Patterns, Idempotent Receiver", text_reused: none}
  - id: AUT-INT-002
    title: Poison messages have a dead letter path with an owner
    severity: high
    tags: [messaging, failure, integration]
    requirement: A message that cannot be processed after bounded retries is moved to a dead letter channel, the design names who watches that channel and how messages are replayed or discarded.
    evidence_hints: [dead letter, DLQ, poison, replay]
    applies_when: {tags_any: [messaging, integration]}
    source: {kind: author-principle, name: Gregor Hohpe and Bobby Woolf, locator: "Enterprise Integration Patterns, Dead Letter Channel and Invalid Message Channel", text_reused: none}
  - id: AUT-INT-003
    title: The integration style is chosen deliberately per interaction
    severity: medium
    tags: [integration, coupling, messaging, api]
    requirement: For each interaction the design says whether it is a synchronous call, an asynchronous message or a shared data store, and why that style fits the coupling and timing needs of that interaction.
    evidence_hints: [synchronous, asynchronous, request-reply, event, shared database]
    applies_when: {tags_any: [integration, messaging, api, coupling]}
    source: {kind: author-principle, name: Gregor Hohpe and Bobby Woolf, locator: "Enterprise Integration Patterns, Chapter 2, Integration Styles", text_reused: none}
  - id: AUT-INT-004
    title: Message contracts are versioned and evolve compatibly
    severity: medium
    tags: [messaging, versioning, api, integration]
    requirement: Message schemas have a version, additive changes are the norm, consumers ignore unknown fields, and the design states how a breaking change would be rolled out across producers and consumers.
    evidence_hints: [schema version, compatible, registry, unknown fields]
    applies_when: {tags_any: [messaging, versioning, api, integration]}
    source: {kind: author-principle, name: Gregor Hohpe and Bobby Woolf, locator: "Enterprise Integration Patterns, Canonical Data Model and Message Translator", text_reused: none}
  - id: AUT-INT-005
    title: Database changes and published events are atomic
    severity: high
    tags: [messaging, consistency, data, integration]
    requirement: Where a service both updates its database and publishes an event, the design prevents one happening without the other, for example through a transactional outbox or change data capture.
    evidence_hints: [outbox, CDC, dual write, atomic, transaction log]
    applies_when: {tags_any: [messaging, data, consistency, integration]}
    source: {kind: author-principle, name: Chris Richardson, locator: "Microservices Patterns, Transactional Outbox", text_reused: none}
  - id: AUT-INT-006
    title: Long-running processes are modelled as sagas with compensation
    severity: medium
    tags: [messaging, consistency, integration]
    requirement: A multi-step business process across services names its steps, the compensating action for each step, and how a partially completed process is detected and resolved.
    evidence_hints: [saga, compensation, orchestration, choreography, timeout]
    applies_when: {tags_any: [messaging, integration, consistency]}
    source: {kind: author-principle, name: Chris Richardson, locator: "Microservices Patterns, Saga", text_reused: none}
