name: authors-stability-operations
layer: base
version: 0.1.0
description: Stability and operations principles. No text reused.
rules:
  - id: AUT-STAB-001
    title: Integration points are treated as the primary source of failure
    severity: high
    tags: [resilience, failure, integration]
    requirement: Every call to another system is wrapped with a timeout, a failure response, and a way to stop calling when the other side is unhealthy, because integration points are where cascading failures start.
    evidence_hints: [integration point, cascading, timeout, circuit]
    applies_when: {tags_any: [integration, resilience, failure, api, messaging]}
    source: {kind: author-principle, name: Michael Nygard, locator: "Release It! 2nd ed., Chapter 4, Stability Antipatterns: Integration Points", text_reused: none}
  - id: AUT-STAB-002
    title: Steady state is designed, so nothing grows without bound
    severity: medium
    tags: [resilience, capacity, data]
    requirement: Logs, caches, tables and queues each have a mechanism that keeps them bounded over time without human intervention, such as rotation, eviction or archival.
    evidence_hints: [rotation, eviction, archive, purge, unbounded]
    source: {kind: author-principle, name: Michael Nygard, locator: "Release It! 2nd ed., Stability patterns: Steady State", text_reused: none}
  - id: AUT-STAB-003
    title: Four key delivery metrics are known for the service
    severity: low
    scope: practice
    tags: [delivery, deployment]
    requirement: The design or its operating plan names how deployment frequency, lead time for changes, change failure rate and time to restore are measured for this service.
    evidence_hints: [deployment frequency, lead time, change failure, restore]
    applies_when: {min_tier: 2}
    source: {kind: author-principle, name: Nicole Forsgren, Jez Humble and Gene Kim, locator: "Accelerate, Chapter 2, Measuring Performance", text_reused: none}
  - id: AUT-STAB-004
    title: Toil is identified and has a reduction plan
    severity: low
    scope: practice
    tags: [delivery]
    requirement: Manual, repetitive operational work the design will create is named, and either automated in the design or scheduled for automation.
    evidence_hints: [manual, toil, runbook automation, operator]
    source: {kind: reference, name: "Site Reliability Engineering (Google), Chapter 5, Eliminating Toil", url: https://sre.google/sre-book/eliminating-toil/, licence: "CC BY-NC-ND 4.0, cited only", text_reused: none}
  - id: AUT-STAB-005
    title: Capacity and failure assumptions are revisited after incidents
    severity: low
    scope: practice
    tags: [delivery, resilience]
    requirement: The operating plan names a blameless review for incidents and a path for its findings to change the design.
    evidence_hints: [postmortem, incident review, blameless, action item]
    applies_when: {min_tier: 2}
    source: {kind: reference, name: "Site Reliability Engineering (Google), Chapter 15, Postmortem Culture", url: https://sre.google/sre-book/postmortem-culture/, licence: "CC BY-NC-ND 4.0, cited only", text_reused: none}
